name: Deploy

# Deploys when the app, or the snapshot it points at, changes on main. README and
# pipeline changes don't redeploy.
on:
  push:
    branches: [main]
    paths:
      - app.R
      - methods.md
      - DESCRIPTION
      - "R/**"
      - "sql/**"
      - data/SNAPSHOT
      - scripts/deploy.R
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to shinyapps.io
    runs-on: ubuntu-latest
    environment:
      name: shinyapps.io
      url: https://${{ vars.SHINYAPPS_ACCOUNT }}.shinyapps.io/trial-feasibility-explorer/
    env:
      SHINYAPPS_ACCOUNT: ${{ vars.SHINYAPPS_ACCOUNT }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # cpp11 is a build-time (LinkingTo) dependency of RSQLite and others. Binary
      # installs skip it, but rsconnect's renv snapshot refuses to run without it.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::cpp11

      # The database is a release asset, not part of git history; data/SNAPSHOT names it.
      - name: Download the pinned data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(head -n 1 data/SNAPSHOT)"
          gh release download "$tag" --dir data --pattern trials.sqlite.gz --pattern trials.sqlite.sha256
          gunzip --force data/trials.sqlite.gz
          (cd data && sha256sum --check trials.sqlite.sha256)

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'

      # Boot the real app against the real snapshot before shipping it.
      - name: Check the app starts and serves the dashboard
        run: |
          Rscript -e 'shiny::runApp(port = 3838, launch.browser = FALSE)' > app.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3838 > index.html && break
            sleep 2
          done
          grep -q "Clinical Trial Feasibility Explorer" index.html || { cat app.log; exit 1; }
          kill "$app_pid"

      - name: Deploy
        if: env.SHINYAPPS_ACCOUNT != '' && env.SHINYAPPS_TOKEN != '' && env.SHINYAPPS_SECRET != ''
        run: Rscript scripts/deploy.R

      - name: Note a skipped deploy
        if: env.SHINYAPPS_ACCOUNT == '' || env.SHINYAPPS_TOKEN == '' || env.SHINYAPPS_SECRET == ''
        run: echo "::notice::shinyapps.io credentials aren't configured for this repository, so the deploy step was skipped."
